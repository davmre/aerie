{% extends "base.html" %}

{% block title %}Read - Aerie{% endblock %}

{% block extra_styles %}
<style>
    .read-tweet {
        max-width: 600px;
        margin: 0 auto 16px;
    }

    .read-tweet .tweet-text {
        font-size: 1.1rem;
        line-height: 1.6;
    }

    .reason-tooltip {
        margin-top: 8px;
        padding: 8px 12px;
        background: #0d0d0d;
        border-radius: 6px;
        font-size: 0.85rem;
        color: #888;
        display: none;
    }

    .read-tweet:hover .reason-tooltip {
        display: block;
    }

    .load-more {
        text-align: center;
        padding: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="controls" style="max-width: 600px; margin: 0 auto 20px;">
    <label>Mode:</label>
    <select id="mode-select">
        {% for mode in modes %}
        <option value="{{ mode.id }}">{{ mode.name }}</option>
        {% endfor %}
    </select>

    <label>Sort:</label>
    <select id="sort-select">
        <option value="created_at">Tweet date</option>
        <option value="captured_at">Captured date</option>
    </select>
</div>

<div id="tweets-container">
    <div class="loading">Loading tweets...</div>
</div>

<div class="load-more" id="load-more" style="display: none;">
    <button class="btn" onclick="loadMore()">Load more</button>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_SIZE = 30;
let offset = 0;
let hasMore = true;
let loading = false;

const container = document.getElementById('tweets-container');
const modeSelect = document.getElementById('mode-select');
const sortSelect = document.getElementById('sort-select');
const loadMoreDiv = document.getElementById('load-more');

async function loadTweets(append = false) {
    if (loading) return;
    loading = true;

    if (!append) {
        container.innerHTML = '<div class="loading">Loading tweets...</div>';
        offset = 0;
    }

    try {
        const params = new URLSearchParams({
            mode: modeSelect.value,
            status: 'approved',
            sort: sortSelect.value,
            limit: PAGE_SIZE,
            offset: offset
        });

        const response = await fetch(`/api/ui/tweets?${params}`);
        const data = await response.json();

        if (!append) {
            container.innerHTML = '';
        }

        if (data.tweets.length === 0 && !append) {
            container.innerHTML = '<div class="loading">No approved tweets in this mode yet</div>';
            loadMoreDiv.style.display = 'none';
            return;
        }

        data.tweets.forEach(tweet => {
            container.insertAdjacentHTML('beforeend', renderTweet(tweet));
        });

        hasMore = data.tweets.length === PAGE_SIZE;
        loadMoreDiv.style.display = hasMore ? 'block' : 'none';
        offset += data.tweets.length;

    } catch (err) {
        if (!append) {
            container.innerHTML = `<div class="loading">Error: ${err.message}</div>`;
        }
    } finally {
        loading = false;
    }
}

function loadMore() {
    loadTweets(true);
}

function renderTweet(tweet) {
    const response = tweet.responses?.[0];
    const reason = response?.response?.reason || '';
    const tweetUrl = tweet.author_username
        ? `https://twitter.com/${tweet.author_username}/status/${tweet.id}`
        : `https://twitter.com/i/status/${tweet.id}`;
    const retweetedBy = tweet.retweeted_by || [];
    const threadAncestors = tweet.thread_ancestors || [];

    return `
        <div class="tweet read-tweet">
            ${retweetedBy.length > 0 ? `
                <div class="retweeted-by">
                    🔁 Retweeted by ${retweetedBy.map(rt => escapeHtml(rt.retweeter_display_name || rt.retweeter_username)).join(', ')}
                </div>
            ` : ''}
            ${threadAncestors.length > 0 ? renderThreadContext(threadAncestors) : ''}
            <div class="tweet-header">
                <div>
                    <span class="tweet-author">${escapeHtml(tweet.author_display_name || tweet.author_username || 'Unknown')}</span>
                    <span class="tweet-username">@${escapeHtml(tweet.author_username || 'unknown')}</span>
                </div>
                <div class="tweet-meta">
                    <a href="${tweetUrl}" target="_blank" rel="noopener" class="tweet-link">${formatDate(tweet.created_at)}</a>
                </div>
            </div>

            <div class="tweet-text">${renderTextWithUrls(tweet.text || '', tweet.urls)}</div>

            ${tweet.quoted_tweet ? renderQuotedTweet(tweet.quoted_tweet) : ''}

            <div class="tweet-metrics">
                <span>${tweet.like_count || 0} likes</span>
                <span>${tweet.retweet_count || 0} RTs</span>
                <span>${tweet.reply_count || 0} replies</span>
            </div>

            ${reason ? `<div class="reason-tooltip">Approved: ${escapeHtml(reason)}</div>` : ''}
        </div>
    `;
}

function renderTextWithUrls(text, urls) {
    if (!text) return '';
    let result = escapeHtml(text);

    // Parse URLs from the tweet's urls field if available
    if (urls) {
        try {
            const urlList = typeof urls === 'string' ? JSON.parse(urls) : urls;
            if (Array.isArray(urlList)) {
                for (const u of urlList) {
                    const shortUrl = escapeHtml(u.url || '');
                    const expandedUrl = u.expanded_url || u.url;
                    const displayUrl = u.display_url || expandedUrl;
                    if (shortUrl && expandedUrl) {
                        result = result.replace(
                            shortUrl,
                            `<a href="${escapeHtml(expandedUrl)}" target="_blank" rel="noopener">${escapeHtml(displayUrl)}</a>`
                        );
                    }
                }
            }
        } catch (e) {
            console.error('Failed to parse urls:', e);
        }
    }

    // Also find any remaining URLs not in the urls list
    result = result.replace(
        /(https?:\/\/[^\s<]+)/g,
        (match) => {
            // Don't double-wrap already-linked URLs
            if (result.indexOf(`href="${match}"`) !== -1) return match;
            return `<a href="${match}" target="_blank" rel="noopener">${match}</a>`;
        }
    );

    return result;
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    } catch {
        return '';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Render quoted tweet
function renderQuotedTweet(qt) {
    if (!qt) return '';
    const qtUrl = qt.author_username
        ? `https://twitter.com/${qt.author_username}/status/${qt.id}`
        : `https://twitter.com/i/status/${qt.id}`;
    return `
        <div class="quoted-tweet">
            <div class="quoted-tweet-header">
                <span class="tweet-author">${escapeHtml(qt.author_display_name || qt.author_username || 'Unknown')}</span>
                <span class="tweet-username">@${escapeHtml(qt.author_username || 'unknown')}</span>
                <a href="${qtUrl}" target="_blank" rel="noopener" class="tweet-link">↗</a>
            </div>
            <div class="quoted-tweet-text">${escapeHtml(qt.text || '')}</div>
        </div>
    `;
}

// Render thread context (ancestor tweets)
function renderThreadContext(ancestors) {
    if (!ancestors || ancestors.length === 0) return '';
    return `
        <div class="thread-context">
            <div class="thread-label">🧵 Thread context (${ancestors.length} earlier ${ancestors.length === 1 ? 'post' : 'posts'})</div>
            ${ancestors.map(a => {
                const url = a.author_username
                    ? `https://twitter.com/${a.author_username}/status/${a.id}`
                    : `https://twitter.com/i/status/${a.id}`;
                return `
                    <div class="thread-ancestor">
                        <div class="thread-ancestor-header">
                            <span class="tweet-author">${escapeHtml(a.author_display_name || a.author_username || 'Unknown')}</span>
                            <span class="tweet-username">@${escapeHtml(a.author_username || 'unknown')}</span>
                            <a href="${url}" target="_blank" rel="noopener" class="tweet-link">↗</a>
                        </div>
                        <div class="thread-ancestor-text">${escapeHtml(a.text || '')}</div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

// Infinite scroll
window.addEventListener('scroll', () => {
    if (!hasMore || loading) return;
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        loadMore();
    }
});

modeSelect.addEventListener('change', () => loadTweets());
sortSelect.addEventListener('change', () => loadTweets());

loadTweets();
</script>
{% endblock %}
