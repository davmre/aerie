{% extends "base.html" %}

{% block title %}Read - Aerie{% endblock %}

{% block extra_styles %}
<style>
    /* Chain container */
    .chain {
        max-width: 600px;
        margin: 0 auto 24px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-primary);
        border-radius: 12px;
        overflow: hidden;
    }

    /* Individual tweet in chain */
    .chain-tweet {
        position: relative;
        padding: 16px;
        padding-left: 40px;
    }

    .chain-tweet:not(:last-child) {
        border-bottom: none;
    }

    /* Connecting line */
    .chain-tweet::before {
        content: '';
        position: absolute;
        left: 20px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border-thread);
    }

    /* First tweet: line starts from middle */
    .chain-tweet:first-child::before {
        top: 50%;
    }

    /* Last tweet: line ends at middle */
    .chain-tweet:last-child::before {
        bottom: 50%;
    }

    /* Single tweet: no line */
    .chain-tweet:only-child::before {
        display: none;
    }

    /* Node dot on the line */
    .chain-tweet::after {
        content: '';
        position: absolute;
        left: 14px;
        top: 24px;
        width: 14px;
        height: 14px;
        background: var(--bg-secondary);
        border: 2px solid var(--accent);
        border-radius: 50%;
        z-index: 1;
    }

    .chain-tweet .tweet-text {
        font-size: 1.1rem;
        line-height: 1.6;
    }

    .chain-tweet .tweet-header {
        margin-bottom: 8px;
    }

    .chain-tweet .tweet-metrics {
        margin-top: 8px;
    }

    /* Hidden replies indicator */
    .hidden-replies-indicator {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 10px;
        background: var(--bg-nested);
        border: 1px solid var(--border-secondary);
        border-radius: 16px;
        font-size: 0.85rem;
        color: var(--accent);
        cursor: pointer;
        transition: background 0.2s;
    }

    .hidden-replies-indicator:hover {
        background: var(--accent);
        color: var(--bg-primary);
    }

    /* Retweeted by header */
    .chain-retweeted-by {
        padding: 8px 16px;
        background: var(--bg-nested);
        border-bottom: 1px solid var(--border-secondary);
        font-size: 0.85rem;
        color: var(--text-secondary);
    }

    /* Reason tooltip */
    .reason-tooltip {
        margin-top: 8px;
        padding: 8px 12px;
        background: var(--bg-nested);
        border-radius: 6px;
        font-size: 0.85rem;
        color: var(--text-secondary);
        display: none;
    }

    .chain-tweet:hover .reason-tooltip {
        display: block;
    }

    .load-more {
        text-align: center;
        padding: 20px;
    }

    .mode-stats {
        max-width: 600px;
        margin: 0 auto 16px;
        color: var(--text-tertiary);
        font-size: 0.9rem;
        padding: 8px 0;
        border-bottom: 1px solid var(--border-secondary);
    }

    /* Modal styles */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        visibility: hidden;
        transition: background 0.2s, visibility 0.2s;
    }

    .modal-overlay.active {
        background: rgba(0, 0, 0, 0.7);
        visibility: visible;
    }

    .modal-content {
        background-color: #1a1a1a;
        border-radius: 12px;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        position: relative;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.2s, transform 0.2s;
    }

    .modal-overlay.active .modal-content {
        opacity: 1;
        transform: scale(1);
    }

    /* Theme-aware modal backgrounds */
    [data-theme="light"] .modal-content {
        background-color: #ffffff;
    }

    [data-theme="dark"] .modal-content {
        background-color: #1a1a1a;
    }

    .modal-header {
        padding: 16px;
        border-bottom: 1px solid var(--border-secondary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        background-color: inherit;
        z-index: 1;
    }

    .modal-header h3 {
        margin: 0;
        font-size: 1.1rem;
    }

    .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text-secondary);
        padding: 0;
        line-height: 1;
    }

    .modal-close:hover {
        color: var(--text-primary);
    }

    .modal-body {
        padding: 16px;
    }

    /* Parent tweet in modal (shown for context) */
    .modal-parent-tweet {
        padding: 12px;
        background: var(--bg-nested);
        border-radius: 8px;
        margin-bottom: 16px;
        border-left: 3px solid var(--accent);
    }

    .modal-parent-tweet .tweet-header {
        margin-bottom: 8px;
    }

    .modal-parent-tweet .tweet-text {
        font-size: 0.95rem;
    }

    /* Reply in modal */
    .modal-reply {
        padding: 12px;
        border: 1px solid var(--border-secondary);
        border-radius: 8px;
        margin-bottom: 12px;
    }

    .modal-reply:last-child {
        margin-bottom: 0;
    }

    .modal-reply .tweet-header {
        margin-bottom: 8px;
    }

    .modal-reply-count {
        margin-top: 8px;
        font-size: 0.85rem;
        color: var(--accent);
        cursor: pointer;
    }

    .modal-reply-count:hover {
        text-decoration: underline;
    }

    .modal-back {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        cursor: pointer;
        font-size: 0.9rem;
        margin-bottom: 12px;
    }

    .modal-back:hover {
        text-decoration: underline;
    }

    .modal-no-replies {
        color: var(--text-secondary);
        text-align: center;
        padding: 20px;
    }

    /* Classification status indicator */
    .classification-status {
        max-width: 600px;
        margin: 0 auto 16px;
        padding: 8px 16px;
        background: var(--bg-nested);
        border: 1px solid var(--accent);
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        color: var(--accent);
    }

    .spinner-small {
        width: 16px;
        height: 16px;
        border: 2px solid var(--accent);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="controls" style="max-width: 600px; margin: 0 auto 20px;">
    <label>Mode:</label>
    <select id="mode-select">
        {% for mode in modes %}
        <option value="{{ mode.id }}">{{ mode.name }}</option>
        {% endfor %}
    </select>

    <label>Platform:</label>
    <select id="platform-select">
        <option value="all">All</option>
        <option value="twitter">Twitter/X</option>
        <option value="bluesky">Bluesky</option>
    </select>

    <label>Sort:</label>
    <select id="sort-select">
        <option value="created_at">Tweet date</option>
        <option value="captured_at">Captured date</option>
    </select>
</div>

<div class="mode-stats" id="mode-stats"></div>

<!-- Classification status indicator -->
<div class="classification-status" id="classification-status" style="display: none;">
    <span class="spinner-small"></span>
    <span id="classification-status-text">Classifying posts...</span>
</div>

<div id="chains-container">
    <div class="loading">Loading tweets...</div>
</div>

<div class="load-more" id="load-more" style="display: none;">
    <button class="btn" onclick="loadMore()">Load more</button>
</div>

<!-- Replies Modal -->
<div class="modal-overlay" id="replies-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Replies</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
            <!-- Dynamic content -->
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
const PAGE_SIZE = 20;
let offset = 0;
let hasMore = true;
let loading = false;

// Modal navigation history
let modalHistory = [];

const container = document.getElementById('chains-container');
const modeSelect = document.getElementById('mode-select');
const platformSelect = document.getElementById('platform-select');
const sortSelect = document.getElementById('sort-select');
const loadMoreDiv = document.getElementById('load-more');
const statsDiv = document.getElementById('mode-stats');
const modal = document.getElementById('replies-modal');
const modalBody = document.getElementById('modal-body');

// Update stats display for current mode
async function updateStats(mode) {
    const stats = await fetchStats(mode);
    if (stats.error) {
        statsDiv.textContent = '';
        return;
    }
    let platformInfo = '';
    if (stats.platforms) {
        const parts = [];
        if (stats.platforms.twitter) parts.push(`${stats.platforms.twitter} X`);
        if (stats.platforms.bluesky) parts.push(`${stats.platforms.bluesky} Bluesky`);
        if (parts.length > 0) platformInfo = ` (${parts.join(', ')})`;
    }
    statsDiv.textContent = `${stats.total} tweets${platformInfo} | ${stats.approved} approved | ${stats.filtered} filtered | ${stats.pending} pending`;
}

async function loadChains(append = false) {
    if (loading) return;
    loading = true;

    if (!append) {
        container.innerHTML = '<div class="loading">Loading tweets...</div>';
        offset = 0;
    }

    try {
        const params = new URLSearchParams({
            mode: modeSelect.value,
            sort: sortSelect.value,
            limit: PAGE_SIZE,
            offset: offset
        });

        // Add platform filter if not "all"
        if (platformSelect.value !== 'all') {
            params.set('platform', platformSelect.value);
        }

        const response = await fetch(`/api/ui/chains?${params}`);
        const data = await response.json();

        if (!append) {
            container.innerHTML = '';
        }

        if (data.chains.length === 0 && !append) {
            container.innerHTML = '<div class="loading">No approved tweets in this mode yet</div>';
            loadMoreDiv.style.display = 'none';
            return;
        }

        data.chains.forEach(chainData => {
            container.insertAdjacentHTML('beforeend', renderChain(chainData));
        });

        hasMore = data.chains.length === PAGE_SIZE;
        loadMoreDiv.style.display = hasMore ? 'block' : 'none';
        offset += data.chains.length;

    } catch (err) {
        if (!append) {
            container.innerHTML = `<div class="loading">Error: ${err.message}</div>`;
        }
    } finally {
        loading = false;
    }
}

function loadMore() {
    loadChains(true);
}

function renderChain(chainData) {
    const { chain, hidden_replies } = chainData;

    // Check if first tweet was retweeted
    const firstTweet = chain[0];
    const retweetedBy = firstTweet.retweeted_by || [];

    let html = '<div class="chain">';

    // Retweet attribution at top of chain
    if (retweetedBy.length > 0) {
        html += `
            <div class="chain-retweeted-by">
                Retweeted by ${retweetedBy.map(rt => escapeHtml(rt.retweeter_display_name || rt.retweeter_username)).join(', ')}
            </div>
        `;
    }

    // Render each tweet in the chain
    chain.forEach(tweet => {
        html += renderChainTweet(tweet, hidden_replies[tweet.id] || 0);
    });

    html += '</div>';
    return html;
}

function renderChainTweet(tweet, hiddenReplyCount) {
    const response = tweet.responses?.[0];
    const reason = response?.response?.reason || '';
    const { platform, url: tweetUrl } = getPlatformInfo(tweet.id, tweet.platform, tweet.author_username);

    return `
        <div class="chain-tweet">
            <div class="tweet-header">
                <div>
                    <span class="tweet-author">${escapeHtml(tweet.author_display_name || tweet.author_username || 'Unknown')}</span>
                    <span class="tweet-username">@${escapeHtml(tweet.author_username || 'unknown')}</span>
                    ${renderPlatformBadge(platform)}
                </div>
                <div class="tweet-meta">
                    <a href="${tweetUrl}" target="_blank" rel="noopener" class="tweet-link">${formatDate(tweet.created_at)}</a>
                </div>
            </div>

            <div class="tweet-text">${renderCollapsibleText(tweet.text || '', TEXT_LIMIT_TOPLEVEL, true, tweet.urls_json, tweet.media_json)}</div>

            ${renderMedia(tweet.media_json)}

            ${tweet.quoted_tweet ? renderQuotedTweet(tweet.quoted_tweet) : ''}

            <div class="tweet-metrics">
                <span>${tweet.like_count || 0} likes</span>
                <span>${tweet.retweet_count || 0} RTs</span>
                <span>${tweet.reply_count || 0} replies</span>
            </div>

            ${hiddenReplyCount > 0 ? `
                <span class="hidden-replies-indicator" onclick="showReplies('${tweet.id}')">
                    ${hiddenReplyCount} other ${hiddenReplyCount === 1 ? 'reply' : 'replies'}
                </span>
            ` : ''}

            ${reason ? `<div class="reason-tooltip">Approved: ${escapeHtml(reason)}</div>` : ''}
        </div>
    `;
}

// Modal functions
async function showReplies(tweetId) {
    modalHistory = [tweetId];
    await loadRepliesIntoModal(tweetId);
    modal.classList.add('active');
}

async function loadRepliesIntoModal(tweetId) {
    modalBody.innerHTML = '<div class="loading">Loading replies...</div>';

    try {
        const params = new URLSearchParams({ mode: modeSelect.value });
        const response = await fetch(`/api/ui/tweet/${tweetId}/replies?${params}`);
        const data = await response.json();

        if (!data.tweet) {
            modalBody.innerHTML = '<div class="modal-no-replies">Tweet not found</div>';
            return;
        }

        let html = '';

        // Back button if we've navigated deeper
        if (modalHistory.length > 1) {
            html += `
                <div class="modal-back" onclick="goBackInModal()">
                    ← Back
                </div>
            `;
        }

        // Parent tweet for context
        const tweet = data.tweet;
        const { platform: tweetPlatform, url: tweetUrl } = getPlatformInfo(tweet.id, tweet.platform, tweet.author_username);

        html += `
            <div class="modal-parent-tweet">
                <div class="tweet-header">
                    <div>
                        <span class="tweet-author">${escapeHtml(tweet.author_display_name || tweet.author_username || 'Unknown')}</span>
                        <span class="tweet-username">@${escapeHtml(tweet.author_username || 'unknown')}</span>
                        ${renderPlatformBadge(tweetPlatform)}
                    </div>
                    <div class="tweet-meta">
                        <a href="${tweetUrl}" target="_blank" rel="noopener" class="tweet-link">${formatDate(tweet.created_at)}</a>
                    </div>
                </div>
                <div class="tweet-text">${renderCollapsibleText(tweet.text || '', TEXT_LIMIT_CONTEXT, true, tweet.urls_json, tweet.media_json)}</div>
                ${renderMedia(tweet.media_json)}
                ${tweet.quoted_tweet ? renderQuotedTweet(tweet.quoted_tweet) : ''}
            </div>
        `;

        // Replies
        if (data.replies.length === 0) {
            html += '<div class="modal-no-replies">No approved replies</div>';
        } else {
            data.replies.forEach(replyData => {
                const reply = replyData.tweet;
                const replyCount = replyData.reply_count;
                const { platform: replyPlatform, url: replyUrl } = getPlatformInfo(reply.id, reply.platform, reply.author_username);

                html += `
                    <div class="modal-reply">
                        <div class="tweet-header">
                            <div>
                                <span class="tweet-author">${escapeHtml(reply.author_display_name || reply.author_username || 'Unknown')}</span>
                                <span class="tweet-username">@${escapeHtml(reply.author_username || 'unknown')}</span>
                                ${renderPlatformBadge(replyPlatform)}
                            </div>
                            <div class="tweet-meta">
                                <a href="${replyUrl}" target="_blank" rel="noopener" class="tweet-link">${formatDate(reply.created_at)}</a>
                            </div>
                        </div>
                        <div class="tweet-text">${renderCollapsibleText(reply.text || '', TEXT_LIMIT_TOPLEVEL, true, reply.urls_json, reply.media_json)}</div>
                        ${renderMedia(reply.media_json)}
                        ${reply.quoted_tweet ? renderQuotedTweet(reply.quoted_tweet) : ''}
                        ${replyCount > 0 ? `
                            <div class="modal-reply-count" onclick="navigateToReplies('${reply.id}')">
                                ${replyCount} ${replyCount === 1 ? 'reply' : 'replies'} →
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        modalBody.innerHTML = html;

    } catch (err) {
        modalBody.innerHTML = `<div class="modal-no-replies">Error: ${err.message}</div>`;
    }
}

function navigateToReplies(tweetId) {
    modalHistory.push(tweetId);
    loadRepliesIntoModal(tweetId);
}

function goBackInModal() {
    if (modalHistory.length > 1) {
        modalHistory.pop();
        loadRepliesIntoModal(modalHistory[modalHistory.length - 1]);
    }
}

function closeModal() {
    modal.classList.remove('active');
    modalHistory = [];
}

// Close modal on overlay click
modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        closeModal();
    }
});

// Close modal on Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
    }
});

// =========================================================================
// Classification triggering and polling
// =========================================================================

let pollInterval = null;
let lastPollTime = null;
const classificationStatus = document.getElementById('classification-status');
const classificationStatusText = document.getElementById('classification-status-text');

async function triggerClassification(options = {}) {
    const params = {
        mode_id: modeSelect.value,
        limit: options.limit || 100,
        max_age_hours: options.max_age_hours || 48,
    };

    if (platformSelect.value !== 'all') {
        params.platform = platformSelect.value;
    }

    // Support for scroll-triggered classification of older posts
    if (options.before) {
        params.before = options.before;
    }

    try {
        const resp = await fetch('/api/classify/trigger', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(params)
        });
        const data = await resp.json();

        // If there are queued items, start polling
        if (data.queued > 0) {
            showClassificationStatus(`Classifying ${data.queued} posts...`);
            startPolling();
        }

        return data;
    } catch (err) {
        console.error('Error triggering classification:', err);
        return { queued: 0, already_decided: 0, prefilter_decided: 0 };
    }
}

function showClassificationStatus(text) {
    classificationStatusText.textContent = text;
    classificationStatus.style.display = 'flex';
}

function hideClassificationStatus() {
    classificationStatus.style.display = 'none';
}

function startPolling() {
    if (pollInterval) return;
    lastPollTime = new Date().toISOString();

    pollInterval = setInterval(async () => {
        try {
            const resp = await fetch(`/api/classify/status?mode_id=${modeSelect.value}&since=${lastPollTime}`);
            const data = await resp.json();

            if (data.newly_classified && data.newly_classified.length > 0) {
                // Refresh the chain list to include new posts
                await loadChains(false);  // false = replace, not append
                updateStats(modeSelect.value);
                lastPollTime = new Date().toISOString();
            }

            // Update status text
            if (data.has_pending) {
                showClassificationStatus(`Classifying ${data.pending_count} posts...`);
            } else {
                stopPolling();
            }
        } catch (err) {
            console.error('Polling error:', err);
        }
    }, 3000);  // Poll every 3 seconds
}

function stopPolling() {
    if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
    }
    hideClassificationStatus();
}

// Get oldest displayed timestamp for scroll-triggered classification
function getOldestDisplayedTimestamp() {
    const chains = document.querySelectorAll('.chain');
    if (chains.length === 0) return null;

    // Find the created_at of the last tweet in the last chain
    // We need to store timestamps in data attributes
    const lastChain = chains[chains.length - 1];
    const lastTweetMeta = lastChain.querySelector('.chain-tweet:last-child .tweet-link');
    // Fall back to current time minus 48 hours if we can't find it
    return null;  // Let the server use max_age_hours
}

// Infinite scroll with classification trigger
window.addEventListener('scroll', async () => {
    if (loading) return;

    const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 500;

    if (nearBottom) {
        if (hasMore) {
            // Normal case: load more already-classified chains
            loadMore();
        } else if (!pollInterval) {
            // No more classified posts - trigger classification of older posts
            loading = true;
            const result = await triggerClassification({
                limit: 50,
                max_age_hours: 168,  // 1 week
            });
            if (result.queued > 0) {
                // Polling will refresh the list when done
            }
            loading = false;
        }
    }
});

// Event handlers with classification triggering
modeSelect.addEventListener('change', () => {
    stopPolling();
    loadChains();
    updateStats(modeSelect.value);
    triggerClassification();
});
platformSelect.addEventListener('change', () => {
    stopPolling();
    loadChains();
    triggerClassification();
});
sortSelect.addEventListener('change', () => loadChains());

// Initial load with classification trigger
loadChains();
updateStats(modeSelect.value);
triggerClassification();
</script>
{% endblock %}
