[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

# Include all Python files in collector
include = ["*.py", "tests/*.py"]

# Exclude cache directories
exclude = ["**/__pycache__"]

# Report missing imports (helps catch typos)
reportMissingImports = true

# These are useful for catching real bugs
reportUnusedVariable = true
reportDuplicateImport = true
reportInvalidTypeForm = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM105", # contextlib.suppress (try-except-pass is more explicit)
    "SIM108", # ternary operator (sometimes less readable)
]

[tool.ruff.lint.isort]
known-first-party = ["database", "modes", "extractors", "prefilters", "datatypes", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (may be slow)",
    "slow: marks tests as slow running",
]
filterwarnings = [
    # Ignore deprecation warnings from datetime.utcnow() - tracked for future fix
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "migrate_*.py",  # One-time migration scripts
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
